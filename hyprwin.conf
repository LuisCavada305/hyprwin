# HyprWin - config no estilo Hyprland.
# Salve este arquivo para recarregar. Erros vão para hyprwin.log.
# Modificadores: SUPER (tecla Win), SHIFT, CTRL, ALT.
# Win+L não pode ser capturada (o Windows reserva para bloquear a tela).

$terminal = wt.exe
$fileManager = explorer.exe
$edge = msedge.exe

general:gaps_in = 5
general:gaps_out = 10
general:col.active_border = rgb(33ccff)
general:col.inactive_border = rgb(595959)
# Tamanho mínimo de um tile (LARGURAxALTURA). Sem espaço para dividir, as janelas novas empilham no último tile.
dwindle:min_tile = 480x240

# Foco segue o mouse (sem trazer a janela para frente). Atraso em ms.
input:follow_mouse = 1
input:follow_mouse_delay = 150

# Esconde a barra de tarefas automaticamente enquanto o HyprWin roda.
misc:autohide_taskbar = 0
# Mostra o indicador de workspaces ao trocar de workspace.
misc:osd = 1
misc:workspaces = 10

# Animações: janelas novas crescem a partir de "popin" do tamanho final;
# trocar de workspace desliza as janelas por "workspace_slide" da largura do monitor.
animations:enabled = 1
animations:duration = 220
animations:popin = 85%
animations:workspace_slide = 0.12

# --- Monitores
# Cada monitor mostra um workspace. Os nomes dos monitores aparecem em hyprwin.log ao iniciar.
# workspace = N, monitor:NOME            fixa o workspace N nesse monitor (Win+N sempre abre nele)
# workspace = N, monitor:NOME, default:true   workspace exibido no monitor ao iniciar
# Workspaces sem regra abrem no monitor em foco.
workspace = 1, monitor:DISPLAY1, default:true
workspace = 2, monitor:DISPLAY1
workspace = 3, monitor:DISPLAY1
workspace = 4, monitor:DISPLAY1
workspace = 5, monitor:DISPLAY1
workspace = 6, monitor:DISPLAY2, default:true
workspace = 7, monitor:DISPLAY2
workspace = 8, monitor:DISPLAY2
workspace = 9, monitor:DISPLAY2
workspace = 10, monitor:DISPLAY2

# --- Programas e janela ativa
bind = SUPER, Q, exec, $terminal
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, W, exec, $edge
# Launcher estilo rofi: busca apps do menu Iniciar; texto sem match roda como comando (">" força comando).
bind = SUPER, R, launcher
bind = SUPER, C, killactive
bind = SUPER, M, exit
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, J, togglesplit
# Mostra/esconde a barra de abas do Windows Terminal (envia Ctrl+Shift+F12 = toggleFocusMode).
# sendshortcut só envia as teclas: o app alvo precisa ter o atalho. O Terminal não vem com este;
# adicione em keybindings do settings.json dele: { "id": "Terminal.ToggleFocusMode", "keys": "ctrl+shift+f12" }
bind = SUPER, T, sendshortcut, CTRL SHIFT, F12, exe:^WindowsTerminal\.exe$

# --- Foco e posição (setas)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# --- Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# --- Mouse: Win + botão esquerdo move, Win + botão direito redimensiona
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Regras (campos: class, title, exe). Efeitos: float, tile, ignore.
windowrulev2 = float, class:^(#32770)$
windowrulev2 = float, title:^(Calculadora|Calculator)$
windowrulev2 = float, title:^(Picture-in-picture|Picture in picture|Imagem sobre imagem)$
windowrulev2 = ignore, exe:^(ShellExperienceHost|StartMenuExperienceHost|SearchHost|TextInputHost|LockApp)\.exe$
